<H1>Modelo de Objeto de Documento</H1>

<img id="acessa" src="apagada.png"/>
<button onclick="ligar()">Ligar</button>
<button onclick="desligar()">Desligar</button>
<script>
    function ligar(){
        document.getElementById('acessa').src ='acessa.png';
    }
    function desligar(){
        document.getElementById('apagada').src = 'apagada.png';
    }
