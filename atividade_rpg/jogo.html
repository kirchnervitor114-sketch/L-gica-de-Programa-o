<html>

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="card">
            <!-- Cabeçalho e título do RPG -->
            <div class="card-header text-center">
                Nome do RPG - Criado por Joab
            </div>
            <!-- Tela Central do Jogo -->
            <div class="card-body" style="background-image: url('assets/bg.png'); background-size : cover; ">
                <div class="row">
                    <!-- Status do Herói -->
                    <div class="col">
                        <ul class="list-group float-end text-center" style="width: 225px">
                            <li class="list-group-item " id="nome-hero">Link</li>
                            <li class="list-group-item" id="titulo-hero">Herói do Tempo</li>
                            <li class="list-group-item">
                                ❤️
                                <progress value="100" max="100" style="accent-color: red;"></progress>
                            </li>
                            <li class="list-group-item">
                                🧪
                                <progress id="mp-hero"value="100" max="100"></progress>
                            </li>
                            <li class="list-group-item">
                                ⚡
                                <progress value="0" max="100" style="accent-color: orange;"></progress>
                            </li>
                        </ul>
                    </div>
                    <!-- Status do Chefe -->
                    <div class="col">
                        <ul class="list-group float-start text-center" style="width: 225px">
                            <li class="list-group-item" id="nome-boss">Link</li>
                            <li class="list-group-item" id="titulo-boss">Herói do Tempo</li>
                            <li class="list-group-item">
                                ❤️
                                <progress id="hp-boss" value="100" max="100" style="accent-color: red;"></progress>
                            </li>
                            <li class="list-group-item">
                                🧪
                                <progress value="100" max="100"></progress>
                            </li>
                            <li class="list-group-item">
                                ⚡
                                <progress value="0" max="100" style="accent-color: orange;"></progress>
                            </li>
                        </ul>
                    </div>
                </div> <!-- fim do row -->
                <div class="row">
                    <!-- IMG HERO -->
                    <div class="col text-end">
                        <img src="assets/heroi.gif" width="250" height="250" />
                        <div class="btn-group" id="controles"></div>
                    </div>
                    <!-- IMG BOSS -->
                    <div class="col">
                        <img src="assets/boss.gif" width="250" height="250" />
                    </div>
                </div>
            </div>
            <div class="card-footer"></div>
        </div> <!-- fechamento do card -->
    </div> <!-- fechamento do container -->
</body>
<script src="javascript.js"></script>

<style>

    body {

        
        background-position: cover;
        background-attachment: fixed;

    }
</style>

</html>
